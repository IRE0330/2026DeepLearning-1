name: Publish verified CCTV analysis 0.3.2

on:
  push:
    branches:
      - mvp/busan-cctv-20261014
    paths:
      - .github/workflows/cctv-analysis-release.yml
    tags:
      - cctv-analysis-v0.3.2

permissions: {}

concurrency:
  group: cctv-analysis-release-0.3.2
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: cctv-analysis-v0.3.2
      - name: Restore original checksum text bytes after Git newline conversion
        run: python -c 'from pathlib import Path; p=Path("cctv-analysis/release-files/SHA256SUMS-0.3.2.txt"); p.write_bytes(p.read_bytes().replace(b"\r\n", b"\n").replace(b"\n", b"\r\n"))'
      - name: Verify frozen artifacts and matching source
        run: python cctv-analysis/scripts/verify_release_assets.py
      - name: Publish module-only release without replacing existing assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: cctv-analysis-v0.3.2
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error title=CCTV Release publication::Release already exists; refusing to overwrite it."
            exit 1
          fi
          if output="$(gh release create "$RELEASE_TAG" \
            --verify-tag --target "$(git rev-parse HEAD)" --latest=false \
            --title 'CCTV analysis 0.3.2 - verified stable handoff' \
            --notes-file cctv-analysis/docs/RELEASE_NOTES_032.md \
            cctv-analysis/release-files/busan_cctv_analysis-0.3.2-py3-none-any.whl \
            cctv-analysis/release-files/busan_cctv_analysis-0.3.2-handoff.zip \
            cctv-analysis/release-files/busan_cctv_analysis-0.3.2-deployment.zip \
            cctv-analysis/release-files/busan_cctv_analysis-0.3.2-example-results.zip \
            cctv-analysis/release-files/SHA256SUMS-0.3.2.txt 2>&1)"; then
            echo "$output"
          else
            printf '::error title=CCTV Release publication::%s\n' "${output//$'\n'/ }"
            exit 1
          fi
